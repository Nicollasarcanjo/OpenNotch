# Publica os apps prontos para baixar sempre que uma tag "v*" é enviada (ex.: v0.3.0).
# Uma release só, com um arquivo para cada sistema.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar (Apple Silicon + Intel)
        env:
          OPENNOTCH_BUILD: ${{ github.run_number }}
          OPENNOTCH_UNIVERSAL: "1"
        run: |
          export OPENNOTCH_VERSION="${GITHUB_REF_NAME#v}"
          ./build.sh

      - name: Empacotar
        run: ditto -c -k --keepParent build/OpenNotch.app OpenNotch-macOS.zip

      - name: Criar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" OpenNotch-macOS.zip \
            --title "OpenNotch $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md

  windows:
    needs: macos   # a release é criada pelo job do macOS; este só anexa o arquivo
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Compilar
        shell: bash
        run: |
          dotnet publish opennotch_windows/OpenNotch.Windows.csproj -c Release -r win-x64 \
            --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true -p:DebugType=none \
            -p:Version="${GITHUB_REF_NAME#v}" -o out

      - name: Empacotar
        shell: pwsh
        run: Compress-Archive -Path out/OpenNotch.exe -DestinationPath OpenNotch-Windows.zip

      # Pacote para enviar à Microsoft Store. A identidade é a do produto no Partner Center
      # (Identidade do produto); não é segredo, ela aparece no próprio pacote publicado.
      # Variáveis do repositório com os mesmos nomes têm prioridade, se existirem.
      - name: Montar o pacote da Microsoft Store
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'nicollasarc.MacBookNotch-OpenNotch' }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=493F6A5E-BA93-485B-AD4B-A32C77FBDD39' }}
          MSIX_PUBLISHER_DISPLAY: ${{ vars.MSIX_PUBLISHER_DISPLAY || 'nicollasarc' }}
          MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME || 'MacBook Notch - OpenNotch' }}
        run: ./opennotch_windows/Package/build-msix.ps1 -Version ($env:GITHUB_REF_NAME -replace '^v', '')

      - name: Anexar à release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" OpenNotch-Windows.zip OpenNotch-Store.msix
