# Publica o app pronto para baixar sempre que uma tag "v*" é enviada (ex.: v0.2.0).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar (Apple Silicon + Intel)
        env:
          OPENNOTCH_VERSION: ${{ github.ref_name }}
          OPENNOTCH_BUILD: ${{ github.run_number }}
          OPENNOTCH_UNIVERSAL: "1"
        run: |
          export OPENNOTCH_VERSION="${OPENNOTCH_VERSION#v}"
          ./build.sh

      - name: Empacotar
        run: ditto -c -k --keepParent build/OpenNotch.app OpenNotch.zip

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" OpenNotch.zip \
            --title "OpenNotch ${{ github.ref_name }}" \
            --notes-file .github/release-notes.md
